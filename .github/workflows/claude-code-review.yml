name: Claude Code Review

on:
  pull_request:
    types: [opened, synchronize, reopened]

jobs:
  claude-review:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: write
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Claude Code Review
        uses: anthropics/claude-code-action@beta
        with:
          anthropic_api_key: ${{ secrets.ANTHROPIC_API_KEY }}
          direct_prompt: |
            Review this pull request for the UIGen codebase (AI-powered React component generator).

            Focus on:
            - Correctness and potential bugs
            - React/Next.js best practices
            - Type safety (TypeScript issues)
            - Security concerns (especially around the AI prompt, JWT auth, and Prisma queries)
            - Performance (unnecessary re-renders, missing memoization, large bundle impact)
            - Consistency with the existing code style

            Be concise. Flag blocking issues clearly. Skip nitpicks unless they affect correctness or security.
